[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitflow"
version = "0.1.0"
description = "Adaptive nutrition & training coach: deterministic algorithms at the core, AI at the edges."
requires-python = ">=3.11"
dependencies = [
    "pulp>=2.8",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "anthropic>=1.8",
    "pyjwt>=2.8",
    "email-validator>=2",
    "python-dotenv>=1",
    "openai>=1.50",  # for Gemini and other OpenAI-compatible APIs
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
screenshots = ["playwright>=1.40"]  # scripts/screenshots.py

[tool.setuptools.packages.find]
# Only the app itself is a package; tests/ and scripts/ are run from the repo.
include = ["fitflow*"]

[tool.setuptools.package-data]
fitflow = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # PuLP 3.x warns about its bundled CBC solver; no pip-installable replacement on Windows yet.
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
