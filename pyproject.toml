[project]
name = "fitflow"
version = "0.1.0"
description = "Adaptive nutrition & training coach: deterministic algorithms at the core, AI at the edges."
requires-python = ">=3.11"
dependencies = [
    "pulp>=2.8",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "anthropic>=1.8",
    "pyjwt>=2.8",
    "email-validator>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # PuLP 3.x warns about its bundled CBC solver; no pip-installable replacement on Windows yet.
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
