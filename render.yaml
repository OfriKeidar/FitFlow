# Render "Blueprint": creates the web service from this file.
# In the Render dashboard: New -> Blueprint -> pick this GitHub repo.
#
# The database is PostgreSQL on Neon (free, doesn't expire), not on Render: Render's free PostgreSQL
# is deleted 30 days after it's created. The app only needs DATABASE_URL, so switching providers
# needed no code change - on an empty database, startup creates the tables and loads the foods.
services:
  - type: web
    name: fitflow
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false  # the Neon connection string (direct, not pooled), set by hand in the dashboard - it contains a password
      - key: JWT_SECRET
        generateValue: true  # Render generates a long random secret
      - key: GEMINI_API_KEY
        sync: false  # set by hand in the dashboard (free key from Google AI Studio); never committed to git
      - key: SEED_DEMO
        value: "true"  # create demo@fitflow.app / demo1234 on first start, so visitors can try the app
      - key: CHAT_DAILY_LIMIT
        value: "30"  # AI messages per user per day; protects the free-tier quota
