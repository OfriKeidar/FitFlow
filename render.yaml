# Render "Blueprint": creates the web service and a PostgreSQL database from this file.
# In the Render dashboard: New -> Blueprint -> pick this GitHub repo.
services:
  - type: web
    name: fitflow
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true  # Render generates a long random secret
      - key: ANTHROPIC_API_KEY
        sync: false  # set by hand in the dashboard; never committed to git

databases:
  - name: fitflow-db
    plan: free
