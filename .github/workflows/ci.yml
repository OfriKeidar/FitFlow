# Runs on every push and pull request. A red X on GitHub means something broke.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The same test suite against a real PostgreSQL, to catch SQLite-only assumptions.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitflow
          POSTGRES_PASSWORD: fitflow
          POSTGRES_DB: fitflow
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fitflow" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://fitflow:fitflow@localhost:5432/fitflow

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build  # includes the TypeScript type check

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fitflow .
      # Smoke test: start the container and check that the API and the web app both respond.
      - run: |
          docker run -d --name fitflow -p 8000:8000 fitflow
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/health
          curl -sf localhost:8000/ | grep -q '<div id="root">'
